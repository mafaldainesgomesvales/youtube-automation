
name: Create YouTube Video

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Ask Gemini to write a Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          curl --fail-with-body -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Write a short, exciting 30-second YouTube Shorts script about 3 amazing facts about space. Include a catchy opening and a closing sentence."
                }]
              }]
            }' > result.json

          echo "GEMINI GENERATED YOUR SCRIPT:"
          jq -r '.candidates[0].content.parts[].text' result.json
      - name: Install Edge TTS
        run: pip install edge-tts
