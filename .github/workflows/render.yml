
name: Create YouTube Video

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq ffmpeg
          pip install edge-tts

      - name: Ask Gemini to write a Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          curl --fail-with-body -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Write a short, exciting 30-second motivational YouTube Shorts script. Make it inspiring, emotional and original. Return only the spoken script."
                }]
              }]
            }' > result.json

          jq -r '.candidates[0].content.parts[].text' result.json > script.txt

          echo "GENERATED SCRIPT:"
          cat script.txt

      - name: Create male voice
        run: |
          edge-tts \
            --voice en-US-ChristopherNeural \
            --file script.txt \
            --write-media motivational-voice.mp3 \
            --write-subtitles motivational-voice.vtt

      - name: Save voice and subtitles
        uses: actions/upload-artifact@v4
        with:
          name: motivational-voice
          path: |
            motivational-voice.mp3
            motivational-voice.vtt
            script.txt

      - name: Check video tools
        run: |
          ffmpeg -version | head -n 1

      - name: Download background video from Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e

          curl --fail-with-body -sS \
            "https://pixabay.com/api/videos/?key=$PIXABAY_API_KEY&q=nature%20sunrise&per_page=5" \
            -o pixabay.json

          VIDEO_URL=$(jq -r '.hits[0].videos.medium.url' pixabay.json)

          if [ "$VIDEO_URL" = "null" ] || [ -z "$VIDEO_URL" ]; then
            echo "No Pixabay video found"
            exit 1
          fi

          curl --fail-with-body -L "$VIDEO_URL" -o background.mp4

          echo "Pixabay background video downloaded successfully"
      - name: Create vertical YouTube Short
        run: |
          set -e

          ffmpeg -y \
            -stream_loop -1 -i background.mp4 \
            -i motivational-voice.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=motivational-voice.vtt" \
            -t 30 \
            -c:v libx264 -preset veryfast \
            -c:a aac \
            -shortest \
            motivational-short.mp4
      - name: Save finished YouTube Short
        uses: actions/upload-artifact@v4
        with:
          name: finished-youtube-short
          path: motivational-short.mp4
